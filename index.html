<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlipScan">
<meta name="theme-color" content="#080810">
<title>FlipScan</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22FlipScan%22,%22short_name%22:%22FlipScan%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23080810%22,%22theme_color%22:%22%23080810%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23080810'/><text y='.9em' font-size='80'>📷</text></svg>%22,%22sizes%22:%22any%22,%22type%22:%22image/svg+xml%22}]}">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&display=swap');

  :root {
    --bg: #080810;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.07);
    --text: #e8e0d0;
    --muted: #444;
    --green: #88d498;
    --yellow: #f7c559;
    --red: #e05c5c;
    --orange: #ff6b35;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  .header {
    padding: 52px 24px 24px;
    border-bottom: 1px solid var(--border);
  }

  .header-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .header-title {
    font-family: 'Syne', sans-serif;
    font-size: 34px;
    font-weight: 800;
    line-height: 1.05;
    background: linear-gradient(135deg, #e8e0d0 0%, #888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .content { padding: 24px; }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 52px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }

  .drop-zone:active { background: rgba(255,255,255,0.02); }

  .drop-icon { font-size: 44px; margin-bottom: 14px; display: block; }

  .drop-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .drop-sub { font-size: 13px; color: var(--muted); }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; margin-bottom: 0; }

  .btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 18px 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.1s, opacity 0.2s;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary {
    background: linear-gradient(135deg, #e8e0d0, #aaa);
    color: #080810;
  }

  .btn-secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-scan {
    width: 100%;
    background: linear-gradient(135deg, var(--orange), #e05500);
    color: #fff;
    margin-top: 14px;
    font-size: 17px;
    padding: 20px;
  }

  /* Preview */
  .preview-wrap {
    position: relative;
    margin-bottom: 14px;
    border-radius: 16px;
    overflow: hidden;
  }

  .preview-img {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    display: block;
    border-radius: 16px;
  }

  .preview-clear {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.75);
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  /* Loading */
  .loading-wrap {
    text-align: center;
    padding: 48px 0;
  }

  .spinner {
    width: 38px;
    height: 38px;
    border: 3px solid rgba(232,224,208,0.1);
    border-top: 3px solid var(--text);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 16px;
  }

  .loading-stage {
    font-size: 13px;
    color: var(--muted);
    animation: shimmer 1.5s ease infinite;
  }

  /* Results */
  .result-wrap {
    animation: riseUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  .result-name {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .result-meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
  }

  .stat-label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
  }

  .stats-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .verdict-box {
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.65;
    color: #aaa;
    margin-bottom: 20px;
  }

  .recent-title {
    font-size: 10px;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .sale-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
  }

  .sale-title { color: #777; flex: 1; margin-right: 12px; }
  .sale-price { color: var(--text); font-weight: 700; white-space: nowrap; }

  /* Error */
  .error-box {
    background: rgba(224,92,92,0.08);
    border: 1px solid rgba(224,92,92,0.2);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--red);
    margin-top: 12px;
  }

  /* History */
  .history-wrap { margin-top: 32px; }
  .history-title {
    font-size: 10px;
    color: #2a2a2a;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    cursor: pointer;
  }

  .history-name { font-size: 13px; color: #555; }
  .history-price { font-size: 13px; font-weight: 700; color: #333; }

  /* Animations */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes riseUp {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }

  input[type=file] { display: none; }

  .scan-again {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-label">eBay Flip Scanner</div>
  <div class="header-title">What's it<br>worth?</div>
</div>

<div class="content">
  <!-- Upload zone -->
  <div id="uploadZone">
    <div class="drop-zone" onclick="document.getElementById('galleryInput').click()">
      <span class="drop-icon">🔍</span>
      <div class="drop-title">Snap or Upload</div>
      <div class="drop-sub">Identify any item and get real eBay sold prices</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="document.getElementById('cameraInput').click()">
        📷 Camera
      </button>
      <button class="btn btn-secondary" onclick="document.getElementById('galleryInput').click()">
        🖼 Gallery
      </button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <input type="file" id="galleryInput" accept="image/*">
  </div>

  <!-- Preview -->
  <div id="previewZone" style="display:none">
    <div class="preview-wrap">
      <img id="previewImg" class="preview-img" src="" alt="preview">
      <button class="preview-clear" onclick="clearImage()">×</button>
    </div>
    <button class="btn btn-scan" id="scanBtn" onclick="analyze()">
      Find eBay Prices →
    </button>
  </div>

  <!-- Loading -->
  <div id="loadingZone" style="display:none">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-stage" id="loadingStage">Identifying item...</div>
    </div>
  </div>

  <!-- Error -->
  <div id="errorZone" style="display:none">
    <div class="error-box" id="errorMsg"></div>
    <button class="scan-again" onclick="clearImage()">← Try Another Photo</button>
  </div>

  <!-- Result -->
  <div id="resultZone" style="display:none"></div>

  <!-- History -->
  <div id="historyZone" class="history-wrap" style="display:none">
    <div class="history-title">Recent Scans</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
const MODEL = "claude-sonnet-4-20250514";
let currentFile = null;
let scanHistory = [];

function show(id) {
  ['uploadZone','previewZone','loadingZone','errorZone','resultZone'].forEach(z => {
    document.getElementById(z).style.display = z === id ? 'block' : 'none';
  });
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}

function handleFile(file) {
  if (!file) return;
  currentFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('previewImg').src = url;
  show('previewZone');
  document.getElementById('resultZone').style.display = 'none';
  document.getElementById('errorZone').style.display = 'none';
}

function clearImage() {
  currentFile = null;
  document.getElementById('previewImg').src = '';
  document.getElementById('cameraInput').value = '';
  document.getElementById('galleryInput').value = '';
  show('uploadZone');
  document.getElementById('resultZone').style.display = 'none';
  document.getElementById('errorZone').style.display = 'none';
  renderHistory();
}

document.getElementById('cameraInput').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('galleryInput').addEventListener('change', e => handleFile(e.target.files[0]));

async function callClaude(body) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return res.json();
}

function setStage(text) {
  document.getElementById('loadingStage').textContent = text;
}

async function analyze() {
  if (!currentFile) return;

  show('loadingZone');

  try {
    setStage('Identifying item...');
    const b64 = await toBase64(currentFile);

    // Step 1: Identify
    const identRes = await callClaude({
      model: MODEL,
      max_tokens: 800,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: currentFile.type || 'image/jpeg', data: b64 } },
          { type: 'text', text: `Identify this item as specifically as possible for an eBay resale search. Include brand, model, edition, variant, condition notes, and anything that affects resale value.

Return ONLY valid JSON no markdown:
{
  "searchQuery": "optimized eBay search query",
  "itemName": "human readable name",
  "condition": "New|Like New|Very Good|Good|Acceptable",
  "category": "category",
  "keyDetails": "key value-affecting details"
}` }
        ]
      }]
    });

    const identText = identRes.content.find(b => b.type === 'text')?.text || '';
    const identClean = identText.replace(/```json|```/g, '').trim();
    const item = JSON.parse(identClean.match(/\{[\s\S]*\}/)[0]);

    setStage('Searching eBay sold listings...');

    // Step 2: Prices
    const priceRes = await callClaude({
      model: MODEL,
      max_tokens: 1000,
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      messages: [{
        role: 'user',
        content: `Search eBay completed sold listings for: "${item.searchQuery}"

Find the last 10-15 sold listings. Return ONLY valid JSON no markdown:
{
  "itemName": "${item.itemName}",
  "condition": "${item.condition}",
  "avgPrice": number,
  "highPrice": number,
  "lowPrice": number,
  "totalSold": number,
  "demand": "High|Medium|Low",
  "verdict": "2-3 sentence flip assessment. Is it worth buying to resell? What to watch for?",
  "recentSales": [
    { "title": "short title", "price": number },
    { "title": "short title", "price": number },
    { "title": "short title", "price": number },
    { "title": "short title", "price": number },
    { "title": "short title", "price": number }
  ]
}`
      }]
    });

    const priceText = priceRes.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const priceClean = priceText.replace(/```json|```/g, '').trim();
    const prices = JSON.parse(priceClean.match(/\{[\s\S]*\}/)[0]);

    renderResult(prices);

    // Add to history
    scanHistory.unshift({ name: prices.itemName, avg: prices.avgPrice, time: new Date() });
    if (scanHistory.length > 10) scanHistory = scanHistory.slice(0, 10);
    renderHistory();

  } catch (err) {
    document.getElementById('errorMsg').textContent = "Couldn't get pricing data. Try a clearer photo or better lighting.";
    show('uploadZone');
    document.getElementById('errorZone').style.display = 'block';
    document.getElementById('previewZone').style.display = 'block';
    document.getElementById('uploadZone').style.display = 'none';
  }
}

function renderResult(d) {
  const ebayFee = 0.1315;
  const flipMargin = ((d.avgPrice * (1 - ebayFee)) - d.lowPrice).toFixed(2);
  const goodFlip = flipMargin > 10 && d.avgPrice > 15;
  const demandColor = d.demand === 'High' ? '#88d498' : d.demand === 'Medium' ? '#f7c559' : '#e05c5c';
  const profitColor = flipMargin > 0 ? '#88d498' : '#e05c5c';

  const html = `
    <div class="result-wrap">
      <div class="result-name">${d.itemName}</div>
      <div class="result-meta">${d.condition} · ${d.totalSold} recent sales</div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Avg Sold</div>
          <div class="stat-value">$${d.avgPrice}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">High</div>
          <div class="stat-value" style="color:#88d498">$${d.highPrice}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Low</div>
          <div class="stat-value" style="color:#e05c5c">$${d.lowPrice}</div>
        </div>
      </div>

      <div class="stats-grid-2">
        <div class="stat-box">
          <div class="stat-label">Est. Flip Profit</div>
          <div class="stat-value" style="color:${profitColor}">$${flipMargin}</div>
          <div style="font-size:10px;color:#333;margin-top:4px">after ~13% eBay fees</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Demand</div>
          <div class="stat-value" style="color:${demandColor}">${d.demand}</div>
        </div>
      </div>

      <div class="verdict-box" style="background:${goodFlip ? 'rgba(136,212,152,0.07)' : 'rgba(247,197,89,0.07)'};border:1px solid ${goodFlip ? 'rgba(136,212,152,0.15)' : 'rgba(247,197,89,0.15)'}">
        ${d.verdict}
      </div>

      ${d.recentSales?.length ? `
        <div class="recent-title">Recent Sales</div>
        ${d.recentSales.map(s => `
          <div class="sale-row">
            <span class="sale-title">${s.title}</span>
            <span class="sale-price">$${s.price}</span>
          </div>
        `).join('')}
      ` : ''}

      <button class="scan-again" onclick="clearImage()">← Scan Another Item</button>
    </div>
  `;

  show('uploadZone');
  document.getElementById('uploadZone').style.display = 'none';
  document.getElementById('previewZone').style.display = 'none';
  document.getElementById('resultZone').innerHTML = html;
  document.getElementById('resultZone').style.display = 'block';
}

function renderHistory() {
  if (scanHistory.length === 0) {
    document.getElementById('historyZone').style.display = 'none';
    return;
  }
  document.getElementById('historyZone').style.display = 'block';
  document.getElementById('historyList').innerHTML = scanHistory.map(h => `
    <div class="history-item">
      <span class="history-name">${h.name}</span>
      <span class="history-price">$${h.avg} avg</span>
    </div>
  `).join('');
}

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  const sw = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => clients.claim());
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
  `;
  const blob = new Blob([sw], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}
</script>
</body>
</html>
